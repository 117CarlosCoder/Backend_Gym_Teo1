name: CD Backend

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-backend-ec2
  cancel-in-progress: false

jobs:
  build-and-push:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write 
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Convertir nombre de usuario a minúsculas
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> ${GITHUB_ENV}

      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compilar y subir imagen
        uses: docker/build-push-action@v5
        with:
          context: . 
          file: ./Dockerfile
          push: true
          tags: ghcr.io/${{ env.OWNER_LC }}/backend-gym:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e

            exec 9>/tmp/gym-backend-deploy.lock
            flock 9

            # Asegurar Swap por protección general del sistema
            if ! swapon --show | grep -q /swapfile; then
              sudo fallocate -l 2G /swapfile && sudo chmod 600 /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile || echo "AVISO: no se pudo activar el swap"
              grep -q '^/swapfile' /etc/fstab || echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab
            fi

            # Ir a la carpeta del backend en la EC2 y actualizar el docker-compose.yml
            cd ~/app/Backend_Gym_Teo1
            git pull

            # Autenticar Docker en la EC2 con GitHub Packages usando el token de la acción
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Descargar la imagen ya compilada (Tu EC2 no consume recursos aquí)
            docker compose pull app

            # Levantar el contenedor actualizado de forma instantánea
            docker compose up -d app

            # Limpiar imágenes antiguas del backend para ahorrar espacio en disco
            docker image prune -af
