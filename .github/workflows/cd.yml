name: CD Backend

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-backend-ec2
  cancel-in-progress: false

jobs:
  build-and-push:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.vars.outputs.image }}
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Nombre de la imagen (en minúsculas)
        id: vars
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/backend-gym:latest" >> "$GITHUB_OUTPUT"

      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compilar y subir imagen
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.vars.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 30m
          envs: IMAGE
          script: |
            set -e

            exec 9>/tmp/gym-deploy.lock
            flock 9

            docker builder prune -af
            if [ -f /swapfile ]; then
              sudo swapoff /swapfile || true
              sudo rm -f /swapfile
              sudo sed -i '/^\/swapfile/d' /etc/fstab
            fi
            df -h /

            docker pull "$IMAGE"

            docker tag "$IMAGE" gym-system-backend:latest

            cd ~/app/Frontend_Gym_Teo1
            git pull --ff-only || echo "AVISO: no se pudo actualizar el repo del Frontend"

            docker compose up -d --no-build db
            docker compose up -d --no-build --no-deps --force-recreate backend

            docker compose up -d --no-build --no-deps --force-recreate frontend || echo "AVISO: no se pudo levantar el frontend"

            docker image prune -f
            docker ps
