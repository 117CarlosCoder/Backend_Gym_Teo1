server.port=8080

spring.application.name=backend-gym-teo1

# Importar variables desde .env si existe en la raiz del proyecto
spring.config.import=optional:file:.env[.properties]

# conexion a base de datos
spring.datasource.url=${DB_URL}
spring.datasource.name=${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# configuracion temporal
spring.security.user.name=${USER_SECURITY}
spring.security.user.password=${PASSWORD_SECURITY}
spring.security.user.roles=USER

# configuracion Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.locations=classpath:db/migration

# configuracion JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

# configuracion correo (Resend API)
resend.api-key=${RESEND_API_KEY}
resend.from=${RESEND_FROM:Gimnasio <onboarding@resend.dev>}

# Inicializador de datos programatico (solo si usuario esta vacia)
app.data-initializer.enabled=${DATA_INITIALIZER_ENABLED:false}

# Configuracion Swagger UI (orden alfabetico: Autenticacion -> Roles -> Usuarios)
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.display-request-duration=true

# Silenciar aviso informativo de Spring Security sobre UserDetailsManager
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR
